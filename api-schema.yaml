        Wraps successful viewset responses in the standard API envelope.

        Responses that are already enveloped (through ``api_success``) or error
        responses are left untouched.
      summary: Budgets that reached their alert threshold
      parameters:
      - in: query
        name: month
        schema:
          type: integer
          maximum: 12
          minimum: 1
      - in: query
        name: year
        schema:
          type: integer
          maximum: 2100
          minimum: 2000
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/budgets/summary/:
