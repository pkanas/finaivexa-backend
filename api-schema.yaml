components:
  schemas:
    AddMemberRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        role:
          $ref: '#/components/schemas/RoleEnum'
      required:
      - email
    AnalysisQueryRequest:
      type: object
      properties:
        month:
          type: integer
          maximum: 12
          minimum: 1
        year:
          type: integer
          maximum: 2100
          minimum: 2000
    Budget:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        category:
          allOf:
          - $ref: '#/components/schemas/Category'
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        month:
          type: integer
          maximum: 12
          minimum: 1
        year:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        alert_threshold:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        is_active:
          type: boolean
        spent:
          type: string
          readOnly: true
        remaining:
          type: string
          readOnly: true
        utilization_percentage:
          type: number
          format: double
          readOnly: true
        status:
          type: string
          readOnly: true
        is_alert:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - category
      - created_at
      - id
      - is_alert
      - month
      - remaining
      - spent
      - status
      - utilization_percentage
      - year
    BudgetRequest:
      type: object
      properties:
        category_id:
          type: integer
          writeOnly: true
          nullable: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        month:
          type: integer
          maximum: 12
          minimum: 1
        year:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        alert_threshold:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        is_active:
          type: boolean
      required:
      - amount
      - month
      - year
    CategorizeRequest:
      type: object
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 255
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
      required:
      - description
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        type:
          $ref: '#/components/schemas/TypeEnum'
        icon:
          type: string
          maxLength: 64
        color:
          type: string
          maxLength: 16
        is_default:
          type: boolean
          readOnly: true
        scope:
          type: string
          readOnly: true
      required:
      - id
      - is_default
      - name
      - scope
      - type
    CategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        type:
          $ref: '#/components/schemas/TypeEnum'
        icon:
          type: string
          maxLength: 64
        color:
          type: string
          maxLength: 16
      required:
      - name
      - type
    ChangePasswordRequest:
      type: object
      properties:
        old_password:
          type: string
          writeOnly: true
          minLength: 1
        new_password:
          type: string
          writeOnly: true
          minLength: 8
        new_password2:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - new_password
      - new_password2
      - old_password
    CustomTokenObtainPairRequest:
      type: object
      description: Adds safe user details to the login response.
      properties:
        email:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    FinancialQueryRequest:
      type: object
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 500
      required:
      - question
    Group:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 150
        description:
          type: string
        currency:
          type: string
          maxLength: 3
        created_by:
          allOf:
          - $ref: '#/components/schemas/UserLite'
          readOnly: true
        members:
          type: array
          items:
            $ref: '#/components/schemas/UserLite'
          readOnly: true
        member_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - created_by
      - id
      - member_count
      - members
      - name
    GroupCreate:
      type: object
      properties:
        name:
          type: string
          maxLength: 150
        description:
          type: string
        currency:
          type: string
          maxLength: 3
      required:
      - name
    GroupCreateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        description:
          type: string
        currency:
          type: string
          minLength: 1
          maxLength: 3
      required:
      - name
    GroupExpenseCreateRequest:
      type: object
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 255
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        date:
          type: string
          format: date
        split_type:
          $ref: '#/components/schemas/SplitTypeEnum'
        paid_by:
          type: integer
        category_id:
          type: integer
          writeOnly: true
          nullable: true
        shares:
          type: array
          items:
            $ref: '#/components/schemas/ShareInputRequest'
          writeOnly: true
      required:
      - amount
      - description
      - paid_by
    GroupRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        description:
          type: string
        currency:
          type: string
          minLength: 1
          maxLength: 3
      required:
      - name
    PaginatedBudgetList:
