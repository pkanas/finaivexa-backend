openapi: 3.0.3
info:
  title: AI Personal Finance API
  version: 1.0.0
  description: Production-ready REST API for personal finance, expense tracking, group
    settlements and AI-powered insights.
paths:
  /api/v1/ai/analyze-spending:
    post:
      operationId: v1_ai_analyze_spending_create
      summary: AI analysis of monthly spending
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalysisQueryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AnalysisQueryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AnalysisQueryRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/ai/categorize:
    post:
      operationId: v1_ai_categorize_create
      summary: Suggest a category for a transaction description
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategorizeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CategorizeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CategorizeRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/ai/query:
    post:
      operationId: v1_ai_query_create
      summary: Ask a natural-language question about your finances
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinancialQueryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FinancialQueryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FinancialQueryRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/ai/recommend-budgets:
    post:
      operationId: v1_ai_recommend_budgets_create
      summary: AI budget recommendations based on recent averages
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/ai/unusual-expenses:
